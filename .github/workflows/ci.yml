name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: human-plus-windows
          path: |
            dist/*.exe
